spring.application.name=FitnessAppBackend
server.port=${SERVER_PORT:8081}
# ---- Firebase ----
firebase.service.account.key.path=${FIREBASE_SERVICE_ACCOUNT_KEY_PATH}
firebase.project.id=${FIREBASE_PROJECT_ID}
# ---- JWT ----
# access token: 1 hour, refresh token: 7 days (values in milliseconds)
jwt.expirationMs=3600000
jwt.refreshExpirationMs=604800000
jwt.secretKey=${JWT_SECRET_KEY}
# version of app
version.app=v.0.0.1
# ---- Swagger / OpenAPI ----
# Set SWAGGER_ENABLED=false in production
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
# jwt testing token creation
user.creation.secret.key=${JWT_CREATION_SECRET_KEY}
## Root Logging level
#logging.level.root=TRACE
# ---- Logging ----
# Log files are written here (see logback-spring.xml). Override with the APP_LOG_DIR environment variable,
# e.g. APP_LOG_DIR=./logs for local development.
app.log.dir=${APP_LOG_DIR:/home/sangam/apps/fitness/logs}
# ---- PostgreSQL ----
# Local default is used when DB_URL is not set. DB_USERNAME / DB_PASSWORD must come from the environment.
# For Render use: jdbc:postgresql://<host>:5432/<db>?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appfitness}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# ---- JPA ----
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Hibernate SQL goes through the logger now (set to DEBUG temporarily to see queries):
#logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=false
# ---- Gmail SMTP ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# the account the emails are sent from
spring.mail.username=${SPRING_EMAIL_SENDER_USERNAME}
spring.mail.password=${SPRING_EMAIL_SENDER_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
# Timeouts (ms): stops a slow SMTP server from hanging your async threads
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
######
fitness.portal.admin.email=${FITNESS_PORTAL_ADMIN_EMAIL:}
fitness.portal.admin.password=${FITNESS_PORTAL_ADMIN_PASSWORD:}
fitness.portal.admin.name=${FITNESS_PORTAL_ADMIN_NAME:Portal Admin}
fitness.portal.base-url=${FITNESS_PORTAL_BASE_URL:http://localhost:5173}
#here set the receiver like (contact.fitnessapp@app.in) this email receives the email send by user
app.mail.support-email=sangamgarg17@gmail.com
# Max size for a single file
# Max size for the entire multipart payload (e.g. 3 files + JSON)
#spring.servlet.multipart.enabled=true
#spring.servlet.multipart.max-file-size=10MB
#spring.servlet.multipart.max-request-size=35MB
app.auth.otp.expiry-seconds=600
app.auth.otp.resend-cooldown-seconds=60
app.auth.otp.reset-token-expiry-seconds=600
# ---- Activity Module ----
activity.daily-active-minutes-goal=${ACTIVITY_DAILY_ACTIVE_MINUTES_GOAL:30}
# Exclude activities exported by MusclePlay itself.
activity.sync.ignored-origin-ids=${ACTIVITY_SYNC_IGNORED_ORIGIN_IDS:com.muscleplay.app}
gamification.time-zone=${GAMIFICATION_TIME_ZONE:Asia/Kolkata}
gamification.activity.minimum-duration-seconds=${GAMIFICATION_MIN_ACTIVITY_SECONDS:60}
gamification.activity.xp=${GAMIFICATION_ACTIVITY_XP:50}
gamification.activity.coins=${GAMIFICATION_ACTIVITY_COINS:10}
gamification.daily.max-xp=${GAMIFICATION_DAILY_MAX_XP:300}
gamification.daily.max-coins=${GAMIFICATION_DAILY_MAX_COINS:100}
gamification.games.minimum-duration-seconds=${GAMIFICATION_GAME_MIN_DURATION_SECONDS:10}
gamification.games.max-reps-per-minute=${GAMIFICATION_GAME_MAX_REPS_PER_MINUTE:180}
gamification.games.xp-per-rep=${GAMIFICATION_GAME_XP_PER_REP:1}
gamification.games.coins-per-session=${GAMIFICATION_GAME_COINS_PER_SESSION:5}
NUTRITION_GEMINI_ENABLED=true
GEMINI_API_KEY=your_api_key
GEMINI_MODEL=gemini-2.5-flash
# Stage 4B - Gemini Nutrition AI (keep API key in environment/secrets, never commit it)
nutrition.ai.gemini.enabled=${NUTRITION_GEMINI_ENABLED:false}
nutrition.ai.gemini.api-key=${GEMINI_API_KEY:}
nutrition.ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
nutrition.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
# Multipart limit for the ingredient image endpoint
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
