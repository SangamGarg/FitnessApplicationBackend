<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Support Request</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f5f5f5; padding:20px;">

<div style="max-width:650px; margin:auto; background:#ffffff;
            padding:25px; border-radius:12px;">

    <h2 style="color:#FF5722;">New Support Request</h2>

    <p>A new support message has been submitted through FitnessApp.</p>

    <hr>

    <h3>User Information</h3>

    <p><strong>Email:</strong>
        <span th:text="${userEmail}"></span>
    </p>

    <p><strong>User ID:</strong>
        <span th:text="${userId}"></span>
    </p>

    <hr>

    <h3>Issue Details</h3>

    <p><strong>Category:</strong>
        <span th:text="${category}"></span>
    </p>

    <p><strong>Subject:</strong>
        <span th:text="${subject}"></span>
    </p>

    <p><strong>Message:</strong></p>

    <div style="background:#f8f8f8; padding:15px; border-radius:8px;
                white-space:pre-wrap;"
         th:text="${message}">
    </div>

    <hr>

    <h3>Device Diagnostics</h3>

    <p><strong>Device:</strong>
        <span th:text="${diagnostics.deviceModel}"></span>
    </p>

    <p><strong>Manufacturer:</strong>
        <span th:text="${diagnostics.deviceManufacturer}"></span>
    </p>

    <p><strong>OS Version:</strong>
        <span th:text="${diagnostics.osVersion}"></span>
    </p>

    <p><strong>App Version:</strong>
        <span th:text="${diagnostics.appVersion}"></span>
    </p>

    <p><strong>Build Number:</strong>
        <span th:text="${diagnostics.appBuildNumber}"></span>
    </p>

    <p><strong>Device Type:</strong>
        <span th:text="${diagnostics.deviceType}"></span>
    </p>

    <hr>

    <p style="color:#777;">
        FitnessApp Support System
    </p>

</div>
</body>
</html>
